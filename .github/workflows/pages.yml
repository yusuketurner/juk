name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add editorial visual layers
        run: |
          python - <<'PY'
          from pathlib import Path

          sitemap = '''<div class="footer-sitemap"><div class="footer-sitemap-title"><span>SITEMAP</span><strong>サイトマップ</strong></div><nav class="footer-sitemap-links" aria-label="サイトマップ"><a href="index.html">TOP</a><a href="about.html">私たち</a><a href="study.html">学習塾</a><a href="abacus.html">そろばん</a><a href="english.html">英語</a><a href="price.html">料金</a><a href="teacher.html">先生</a><a href="access.html">アクセス</a><a href="blog.html">ブログ</a><a href="contact.html">無料体験・お問い合わせ</a><a href="privacy.html">プライバシーポリシー</a><a href="sitemap.html">サイトマップ</a></nav></div>'''

          visual_break = '''<section class="visual-break" aria-label="学びの風景"><div class="visual-break-inner"><div class="visual-break-photo break-photo-main"><img src="2oju7nIXRXYMj5EXMi5f2z-mTLPUeyx_sqi3_oCTzv20dyEluY5mAIaZ6GnfXAo4ZkonswZX54teIfTLYsmvnEYU8Tzldk9V6tSHA-HHB3TwSt53IvnfRZjSXMgpoGB90sYSODOHm_RZekqjH7ZH0GI32-0FEk0UFfgl0K0XTwcgPzQKRctrCWikqcsm1CVy.jpeg" alt="先生と生徒が学ぶ教室の様子" loading="lazy"></div><div class="visual-break-photo break-photo-side"><img src="GF0f7G2EW9j7JtYBlsTXuvc9Zati-fmS6WSeuP0ZU3r13-KfIEWSJCssFpo3jvqyFzF6ypkYAJWDBqGeHluaDLP5ztHBE7lmJUvu4UOB-OYWcOAY0WAOtS23kD1bEs_fxbLZ0o5DxoKd6ZYadVsOKyg5-r6wwhahDIumCdGq2TKsKWZFWU1MI6Y7opp1Wn4Q.jpeg" alt="教室で学ぶ生徒の様子" loading="lazy"></div><div class="visual-break-copy"><span>EVERYDAY LEARNING</span><strong>「わかった！」が、<br>少しずつ増えていく。</strong><p>写真で感じる、煌めき学舎の日常。学ぶ場所だからこそ、楽しさも伝えたい。</p></div><div class="visual-break-doodle break-pencil">✎</div><div class="visual-break-doodle break-star">✦</div><div class="visual-break-doodle break-note">KIRAMEKI<br>DAY BY DAY</div></div></section>'''

          visual_break_second = '''<section class="visual-break visual-break-second" aria-label="煌めき学舎の学び"><div class="visual-break-inner"><div class="visual-break-photo second-photo-main"><img src="Gemini_Generated_Image_au6usxau6usxau6u.jpg" alt="明るい教室の学習風景" loading="lazy"></div><div class="visual-break-photo second-photo-side"><img src="Gemini_Generated_Image_oov12zoov12zoov1.jpg" alt="学びを楽しむ教室のイメージ" loading="lazy"></div><div class="visual-break-copy second-copy"><span>THE PLACE TO LEARN</span><strong>子どもが、<br>また来たくなる場所。</strong><p>大きな文字、写真、イラストを交互に見せながら、スクロールするたびに印象が変わるTOPへ。</p></div><div class="visual-break-doodle second-doodle">✏︎</div><div class="visual-break-doodle second-circle"></div></div></section>'''

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'stationery.css' not in text and '</head>' in text:
                  text = text.replace('</head>', '<link rel="stylesheet" href="stationery.css"></head>')
              if path.name == 'index.html' and 'home-rhythm.css' not in text and '</head>' in text:
                  text = text.replace('</head>', '<link rel="stylesheet" href="home-rhythm.css"></head>')
              if path.name == 'index.html' and 'home-rhythm-v2.css' not in text and '</head>' in text:
                  text = text.replace('</head>', '<link rel="stylesheet" href="home-rhythm-v2.css"></head>')
              if 'footer-sitemap' not in text and '</footer>' in text:
                  text = text.replace('</footer>', sitemap + '</footer>')
              if path.name == 'index.html':
                  if 'class="visual-break"' not in text and '<section class="world-menu"' in text:
                      text = text.replace('<section class="world-menu"', visual_break + '<section class="world-menu"', 1)
                  if 'visual-break-second' not in text and '<section class="world-kayoi"' in text:
                      text = text.replace('<section class="world-kayoi"', visual_break_second + '<section class="world-kayoi"', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
