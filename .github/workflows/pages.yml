name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build final site layers
        run: |
          python - <<'PY'
          from pathlib import Path
          sitemap = '''<div class="footer-sitemap"><div class="footer-sitemap-title"><span>SITEMAP</span><strong>サイトマップ</strong></div><nav class="footer-sitemap-links" aria-label="サイトマップ"><a href="index.html">TOP</a><a href="about.html">私たち</a><a href="study.html">学習塾</a><a href="abacus.html">そろばん</a><a href="english.html">英語</a><a href="price.html">料金</a><a href="teacher.html">先生</a><a href="access.html">アクセス</a><a href="blog.html">ブログ</a><a href="contact.html">無料体験・お問い合わせ</a><a href="privacy.html">プライバシーポリシー</a><a href="sitemap.html">サイトマップ</a></nav></div>'''
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8').replace('CdG2TK','CdGq2TK')
              if 'stationery.css' not in text and '</head>' in text:
                  text=text.replace('</head>','<link rel="stylesheet" href="stationery.css"></head>')
              if path.name != 'index.html' and 'dayhappy-rebuild.css' not in text and '</head>' in text:
                  text=text.replace('</head>','<link rel="stylesheet" href="dayhappy-rebuild.css"></head>')
              if path.name != 'index.html' and 'final-polish.css' not in text and '</head>' in text:
                  text=text.replace('</head>','<link rel="stylesheet" href="final-polish.css"></head>')
              if path.name != 'index.html' and 'soft-curves.css' not in text and '</head>' in text:
                  text=text.replace('</head>','<link rel="stylesheet" href="soft-curves.css"></head>')
              if 'footer-sitemap' not in text and '</footer>' in text:
                  text=text.replace('</footer>',sitemap+'</footer>')
              path.write_text(text,encoding='utf-8')
          PY
      - name: Validate site output
        run: |
          python - <<'PY'
          from pathlib import Path
          htmls=sorted(Path('.').glob('*.html'))
          assert len(htmls)>=10, f'Expected full multi-page site, found {len(htmls)} HTML files.'
          top=Path('index.html').read_text(encoding='utf-8')
          assert 'top-rebuild' in top, 'TOP rebuild markup is not the deployed index.'
          assert 'top-rebuild.css' in top, 'TOP rebuild CSS is not linked.'
          assert Path('top-rebuild.css').exists(), 'top-rebuild.css is missing.'
          assert top.count('class="top-hero"') == 1
          assert top.count('class="top-concept"') == 1
          for p in htmls:
              text=p.read_text(encoding='utf-8')
              assert '<html' in text and '</html>' in text, p
              assert '<footer' in text, f'Missing footer: {p}'
          print(f'Validated {len(htmls)} HTML pages and TOP rebuild output.')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
